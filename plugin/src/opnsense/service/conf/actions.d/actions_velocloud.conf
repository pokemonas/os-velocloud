[status]
command:/usr/local/opnsense/scripts/velocloud/status.py
parameters:
type:script_output
message:request VeloCloud Edge port status

[apply]
command:/usr/local/etc/rc.configure_firmware
parameters:
type:script
message:apply VeloCloud Edge loader settings

[select]
command:/usr/local/opnsense/scripts/velocloud/select.sh
parameters:
type:script_output
message:install VeloCloud Edge driver modules for the loader
