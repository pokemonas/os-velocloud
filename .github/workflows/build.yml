name: build

# Daily: look for new OPNsense kernels (opnsense/src tags of the series listed
# in ./series), build if_vcigb for each, commit it to modules/, then rebuild
# the os-velocloud package and publish the signed repository on GitHub Pages.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      tags:
        description: "Build these opnsense/src tags or commits (space separated) instead of the new ones"
        required: false
  push:
    branches: [main]
    paths: ["plugin/**", "modules/**", "tools/**", "kit/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Find kernels without a module
        id: find
        env:
          INPUT_TAGS: ${{ github.event.inputs.tags }}
        run: |
          if [ -n "$INPUT_TAGS" ]; then
            LIST=$(echo "$INPUT_TAGS" | tr -cd '0-9a-zA-Z._ ')
          else
            LIST=$(tools/missing-kernels.sh --newer | awk '{print $1}' | tail -n 3 | xargs)
          fi
          echo "tags=$LIST" >> "$GITHUB_OUTPUT"
          echo "to build: ${LIST:-nothing}"

      - name: Install build dependencies
        if: steps.find.outputs.tags != ''
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-18 lld-18 llvm-18 git python3 libarchive-dev \
              libbz2-dev zlib1g-dev time xz-utils

      - name: Build modules
        if: steps.find.outputs.tags != ''
        env:
          TAGS: ${{ steps.find.outputs.tags }}
        run: |
          SERIES=$(head -n 1 series)
          for T in $TAGS; do
            S=$(echo "$T" | grep -oE '^[0-9]+\.[0-9]+' || echo "$SERIES")
            kit/build-vcigb.sh "$T" "$S"
            rm -rf kit/work
          done
          cp -r kit/out/modules/* modules/
          ls -l modules/*

      - name: Commit modules
        if: steps.find.outputs.tags != ''
        env:
          TAGS: ${{ steps.find.outputs.tags }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules
          git commit -m "modules: if_vcigb for $TAGS" || exit 0
          git push

  package:
    needs: modules
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libbsd-dev libarchive-dev zlib1g-dev libbz2-dev liblzma-dev \
              libssl-dev libzstd-dev m4 pkg-config

      - name: Cache pkg tool
        uses: actions/cache@v4
        with:
          path: tools/pkg
          key: pkgtool-2.8.4-${{ runner.os }}

      - name: Build pkg tool
        run: tools/build-pkgtool.sh

      - name: Build package and repository
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          export REPO_URL="https://$(echo "$OWNER" | tr A-Z a-z).github.io/$REPO_NAME"
          if [ -n "$REPO_SIGNING_KEY" ]; then
            umask 077
            printf '%s\n' "$REPO_SIGNING_KEY" > "$RUNNER_TEMP/repo.key"
            KEYARG="$RUNNER_TEMP/repo.key"
          fi
          tools/build-pkg.sh "$OWNER" $KEYARG
          rm -f "$RUNNER_TEMP/repo.key"
          cp README.md public/ 2>/dev/null || true
          touch public/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
